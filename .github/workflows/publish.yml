name: Publish
on: workflow_dispatch
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.21.3
      - name: Check release tag
        run: node -e 'if(process.env.GITHUB_REF_NAME !== "v"+require("./package.json").version) process.exit(1)'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run scan
      - name: Stage the release for npm approval
        run: npm stage publish --provenance --access public
        env:
          RELEASE_MODE: 'true'
